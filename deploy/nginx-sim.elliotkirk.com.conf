# nginx site for sim.elliotkirk.com: serves the static vite client and reverse
# proxies the websocket to the local go server. install to
# /etc/nginx/sites-available/sim.elliotkirk.com and symlink into sites-enabled.
# run `certbot --nginx -d sim.elliotkirk.com` to populate the TLS directives.

# maps the Upgrade header so websocket connections are proxied correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sim.elliotkirk.com;

    # certbot serves its ACME challenge here; everything else goes to https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sim.elliotkirk.com;

    # populated by `certbot --nginx`.
    ssl_certificate     /etc/letsencrypt/live/sim.elliotkirk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sim.elliotkirk.com/privkey.pem;

    # static client build (vite output).
    root /home/steve/population-sim/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # websocket -> go server on localhost:8080. the go handler matches any path,
    # so no rewrite of /ws is needed.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # keep idle websocket connections open.
        proxy_read_timeout 86400;
    }
}
